name: Release Zappy MCP

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          release_dir="$(mktemp -d)"
          binary_name=zappy-mcp
          if [ "$GOOS" = windows ]; then binary_name=zappy-mcp.exe; fi
          go build -trimpath -ldflags "-s -w -X github.com/firmo-tecnologia/zappy-mcp/internal/zappymcp.Version=$release_version" -o "$release_dir/$binary_name" ./cmd/zappy-mcp
          cp README.md "$release_dir/README.md"
          mkdir -p dist
          archive="zappy-mcp_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then
            (cd "$release_dir" && zip "$GITHUB_WORKSPACE/dist/$archive.zip" "$binary_name" README.md)
          else
            tar -czf "dist/$archive.tar.gz" -C "$release_dir" "$binary_name" README.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zappy-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd assets && sha256sum *.tar.gz *.zip > checksums.txt)
          gh release create "$GITHUB_REF_NAME" assets/* --title "Zappy MCP $GITHUB_REF_NAME" --generate-notes
